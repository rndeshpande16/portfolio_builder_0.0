.confetti-cone{
  transform-origin: 200px 50px;
  animation:confetti-cone1 1.2s ease infinite;
}
@keyframes confetti-cone1{
0%{
   transform:translate(40px, 95px)  rotate(45deg) scale(1, 1);
}
15%{
   transform:translate(10px, 145px)  rotate(45deg) scale(1.1, 0.85);

}
100%{
  transform:translate(40px, 105px)  rotate(45deg) scale(1, 1);
}
  }

#yellow-strip {
  fill:none;
  stroke:#F9B732;
  stroke-width:9;
  stroke-linecap:round;
  stroke-miterlimit:10;
  animation: confdash 1.2s ease infinite;
}


@keyframes confdash {
0%{
  stroke-dasharray:1000;
  stroke-dashoffset:500;
  transform:translate(-30px, 30px);
  opacity:0;
}
2%{
  stroke-dasharray:1000;
  stroke-dashoffset:500;
  transform:translate(-30px, 30px);
  opacity:0;
}
35%{
stroke-dasharray:1000;
stroke-dashoffset:900;
transform:translate(-2px, 0px);
opacity:1;
}

85%{
  stroke-dasharray:1000;
  stroke-dashoffset:1000;
  transform:translate(1px, -5px);
  opacity:1;
}
  90%{
  stroke-dashoffset:1000;
   stroke-dashoffset:1000;
  transform:translate(2px, -8px);
  opacity:0;
}
  100%{
  stroke-dashoffset:1000;
   stroke-dashoffset:500;
  transform:translate(2px, -8px);
  opacity:0;
}
}

    <script>
      const loginBtn = document.getElementById("login");
      const formOverlay = document.querySelector(".form-overlay");
      const formSubmit = document.getElementById("form-submit");
      const loggedUserName = document.querySelector("#login-user-name");
      const logout = document.querySelector("#logout");
      const closeBtn = document.getElementById("close-modal");

      loadUserData();

      loginBtn.addEventListener("click", () => {
        formOverlay.style.display = "flex";
      });

      formSubmit.addEventListener("submit", (e) => {
        e.preventDefault();
        const nameValue = document.getElementById("username").value;
        const goalValue = document.getElementById("usergoal").value;

        localStorage.setItem("username", nameValue);
        localStorage.setItem("usergoal", goalValue);

        formOverlay.style.display = "none";
        loadUserData();
      });

      function loadUserData() {
        const storedName = localStorage.getItem("username");

        if (storedName) {
          if (loggedUserName) {
            loggedUserName.innerText = "Hello " + storedName + "!";
          }
          logout.style.display = "block";
          logOut();
        }
      }

      function logOut() {
        logout.onclick = () => {
          localStorage.clear();
          window.location.reload();
        };
      }

      closeBtn.addEventListener("click", () => {
        formOverlay.style.display = "none";
      });
    </script>
