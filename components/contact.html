<style>
  .gradient-container {
    width: 100%;
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    box-sizing: border-box;

    background: linear-gradient(
      45deg,
      var(--color-mediumdark) 50%,
      var(--color-dark) 50%
    );
    background-attachment: fixed;
  }
  .main-menu {
    background-color: var(--color-mediumlight);
    width: 450px;
    max-width: 100%;
    padding: 40px 30px;
    border-radius: 20px;
  }

  .gradient-container .main-menu h1 {
    color: var(--color-dark);
    margin-top: 0;
    font-size: 28px;
  }

  .gradient-container .main-menu p {
    color: var(color-medium);
    margin-bottom: 30px;
    line-height: 1.5;
  }

  .contact-link {
    display: block;
    background-color: var(--color-dark);
    border-radius: 8px;
    margin: 20px 0;
    padding: 15px;
    text-decoration: none;
    font-size: 20px;
    font-weight: bold;
    transition: 0.3s all ease;
  }

  .contact-link:hover {
    background-color: var(--color-medium);
  }

  .gradient-container .main-menu .email-link {
    color: var(--color-light);
  }
  .gradient-container .main-menu .github-link {
    color: var(--color-light);
  }
  .gradient-container .main-menu .linkedin-link {
    color: var(--color-light);
  }
</style>
<div class="gradient-container">
  <section class="main-menu">
    <h1>Get In Touch</h1>
    <p>Feel free to reach out to me through any of the links below!</p>

    <a href="mailto:sahil@example.com" class="contact-link email-link">
      Email Me
    </a>

    <a
      href="https://github.com/sahil"
      target="_blank"
      class="contact-link github-link"
    >
      GitHub Profile
    </a>

    <a
      href="https://linkedin.com/in/sahil"
      target="_blank"
      class="contact-link linkedin-link"
    >
      LinkedIn Profile
    </a>
  </section>
</div>
