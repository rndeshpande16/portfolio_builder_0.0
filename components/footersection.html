<head>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
  />
</head>
<style>
  body {
    margin: 0;
  }
  .footer {
    margin: 0;
    padding: 0;
  }

  hr {
    height: 2.5pt;
    border-radius: 2.5pt;
    background-color: black;
  }
  i {
    font-size: 30pt;
    margin: 0;
    border-radius: 7.5pt;
  }
  .instagram {
    background: linear-gradient(
      -135deg,
      purple,
      darkviolet,
      darkorchid,
      orange,
      yellow
    );
    color: white;
    border-radius: 10pt !important;
    i {
      font-size: 40pt;
    }
  }
  .facebook {
    color: blue;
    i {
      font-size: 40pt;
    }
  }
  .whatsapp {
    color: rgb(0, 187, 0);
    i {
      font-size: 45pt;
    }
  }
  .phone {
    background: green;
    color: white;
  }
  .mail {
    background-color: darkred;
    color: white;
  }
  .social-media div {
    height: 30pt;
    width: 30pt;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 5pt;
    padding: 10px;
  }
  .social-media {
    display: flex;
    gap: 5pt;
    /* justify-content: space-around; */
  }
  .instagram {
    margin-left: 20px;
  }
  .copywright {
    margin-left: 20px;
  }
</style>
<section class="footer">
  <hr />
  <main>
    <div class="social-media">
      <div class="instagram"><i class="fa-brands fa-instagram"></i></div>
      <div class="facebook"><i class="fa-brands fa-facebook"></i></div>
      <div class="whatsapp"><i class="fa-brands fa-whatsapp"></i></div>
      <div class="phone"><i class="fa-solid fa-phone"></i></div>
      <div class="mail"><i class="fa-solid fa-envelope"></i></div>
    </div>
    <div class="copywright"><p>Copywright My Website 2026 &copy;</p></div>
  </main>
</section>
